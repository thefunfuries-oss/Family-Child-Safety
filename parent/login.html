<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Secure parent login for Family Child Safety."
    >

    <title>Parent Login | Family Child Safety</title>

    <!-- Main stylesheet -->
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="auth-page">

    <main class="auth-container">

        <section class="auth-card">

            <!-- Logo / Header -->
            <div class="auth-header">

                <a
                    href="../index.html"
                    class="auth-logo"
                    aria-label="Family Child Safety Home"
                >
                    F
                </a>

                <h1>Welcome Back</h1>

                <p>
                    Sign in to your Family Child Safety parent account.
                </p>

            </div>


            <!-- Login Form -->
            <form
                id="loginForm"
                novalidate
            >

                <!-- Email -->
                <div class="form-group">

                    <label
                        for="email"
                        class="form-label"
                    >
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="form-input"
                        placeholder="Enter your email address"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- Password -->
                <div class="form-group">

                    <label
                        for="password"
                        class="form-label"
                    >
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="form-input"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="togglePassword"
                            aria-label="Show password"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <!-- Remember / Forgot -->
                <div
                    style="
                        display:flex;
                        justify-content:space-between;
                        align-items:center;
                        gap:15px;
                        margin-bottom:22px;
                        font-size:13px;
                    "
                >

                    <label
                        style="
                            display:flex;
                            align-items:center;
                            gap:7px;
                            color:#617067;
                            cursor:pointer;
                        "
                    >

                        <input
                            type="checkbox"
                            id="rememberMe"
                        >

                        Remember me

                    </label>


                    <a
                        href="#"
                        id="forgotPassword"
                        style="
                            color:#16803c;
                            font-weight:700;
                        "
                    >
                        Forgot password?
                    </a>

                </div>


                <!-- Error / Success Message -->
                <div
                    id="loginMessage"
                    class="alert"
                    style="display:none;"
                    role="alert"
                ></div>


                <!-- Login Button -->
                <button
                    type="submit"
                    class="btn btn-primary btn-block"
                    id="loginButton"
                >
                    Sign In
                </button>

            </form>


            <!-- Register -->
            <div
                style="
                    text-align:center;
                    margin-top:25px;
                    padding-top:22px;
                    border-top:1px solid #dce7df;
                    color:#617067;
                    font-size:14px;
                "
            >

                Don't have an account?

                <a
                    href="register.html"
                    style="
                        color:#16803c;
                        font-weight:700;
                    "
                >
                    Create Account
                </a>

            </div>


            <!-- Back to Home -->
            <div
                style="
                    text-align:center;
                    margin-top:18px;
                "
            >

                <a
                    href="../index.html"
                    style="
                        color:#617067;
                        font-size:13px;
                    "
                >
                    ← Back to Home
                </a>

            </div>

        </section>

    </main>


    <!-- Login Page JavaScript -->
    <script>

        /* ---------------------------------------------
           PASSWORD SHOW / HIDE
        --------------------------------------------- */

        const passwordInput =
            document.getElementById("password");

        const togglePassword =
            document.getElementById("togglePassword");


        togglePassword.addEventListener(
            "click",
            function () {

                const isPassword =
                    passwordInput.type === "password";

                passwordInput.type =
                    isPassword ? "text" : "password";

                togglePassword.textContent =
                    isPassword ? "Hide" : "Show";

                togglePassword.setAttribute(
                    "aria-label",
                    isPassword
                        ? "Hide password"
                        : "Show password"
                );

            }
        );


        /* ---------------------------------------------
           LOGIN FORM
           
           Firebase authentication will be connected
           in the next stage.
        --------------------------------------------- */

        const loginForm =
            document.getElementById("loginForm");

        const loginButton =
            document.getElementById("loginButton");

        const loginMessage =
            document.getElementById("loginMessage");


        loginForm.addEventListener(
            "submit",
            function (event) {

                event.preventDefault();

                const email =
                    document.getElementById("email")
                        .value
                        .trim();

                const password =
                    document.getElementById("password")
                        .value;


                /* Clear previous message */
                loginMessage.style.display = "none";

                loginMessage.textContent = "";


                /* Basic validation */

                if (!email) {

                    showMessage(
                        "Please enter your email address.",
                        "error"
                    );

                    return;
                }


                if (!password) {

                    showMessage(
                        "Please enter your password.",
                        "error"
                    );

                    return;
                }


                /* Temporary stage */

                loginButton.disabled = true;

                loginButton.textContent =
                    "Signing In...";


                setTimeout(function () {

                    loginButton.disabled = false;

                    loginButton.textContent =
                        "Sign In";

                    showMessage(
                        "Firebase authentication will be connected in the next step.",
                        "success"
                    );

                }, 700);

            }
        );


        /* ---------------------------------------------
           MESSAGE HELPER
        --------------------------------------------- */

        function showMessage(message, type) {

            loginMessage.textContent = message;

            loginMessage.style.display = "block";

            loginMessage.className =
                "alert " +
                (
                    type === "success"
                        ? "alert-success"
                        : "alert-error"
                );

        }


        /* ---------------------------------------------
           FORGOT PASSWORD
           
           Firebase password reset will be connected
           after authentication setup.
        --------------------------------------------- */

        document
            .getElementById("forgotPassword")
            .addEventListener(
                "click",
                function (event) {

                    event.preventDefault();

                    showMessage(
                        "Password recovery will be available after Firebase Authentication is connected.",
                        "success"
                    );

                }
            );

    </script>

</body>
</html>
