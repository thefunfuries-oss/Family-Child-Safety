<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Sign in to Family Child Safety."
    >

    <title>Parent Login | Family Child Safety</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="auth-page">

    <main class="auth-container">

        <section class="auth-card">

            <!-- Header -->
            <div class="auth-header">

                <a
                    href="../index.html"
                    class="auth-logo"
                    aria-label="Family Child Safety Home"
                >
                    F
                </a>

                <h1>Parent Login</h1>

                <p>
                    Sign in to your Family Child Safety account.
                </p>

            </div>


            <!-- Login Form -->
            <form
                id="loginForm"
                novalidate
            >

                <!-- Email -->
                <div class="form-group">

                    <label
                        for="email"
                        class="form-label"
                    >
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        class="form-input"
                        placeholder="Enter your email address"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- Password -->
                <div class="form-group">

                    <label
                        for="password"
                        class="form-label"
                    >
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            class="form-input"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="togglePassword"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <!-- Remember + Forgot -->
                <div
                    style="
                        display:flex;
                        justify-content:space-between;
                        align-items:center;
                        gap:12px;
                        margin-bottom:20px;
                        font-size:13px;
                    "
                >

                    <label
                        style="
                            display:flex;
                            align-items:center;
                            gap:7px;
                            color:#617067;
                        "
                    >

                        <input
                            type="checkbox"
                            id="rememberMe"
                        >

                        Remember me

                    </label>


                    <a
                        href="#"
                        id="forgotPassword"
                        style="
                            color:#16803c;
                            font-weight:700;
                        "
                    >
                        Forgot Password?
                    </a>

                </div>


                <!-- Message -->
                <div
                    id="loginMessage"
                    class="alert"
                    style="display:none;"
                    role="alert"
                ></div>


                <!-- Login -->
                <button
                    type="submit"
                    class="btn btn-primary btn-block"
                    id="loginButton"
                >
                    Sign In
                </button>

            </form>


            <!-- Register -->
            <div
                style="
                    text-align:center;
                    margin-top:25px;
                    padding-top:22px;
                    border-top:1px solid #dce7df;
                    color:#617067;
                    font-size:14px;
                "
            >

                Don't have an account?

                <a
                    href="register.html"
                    style="
                        color:#16803c;
                        font-weight:700;
                    "
                >
                    Create Account
                </a>

            </div>


            <!-- Home -->
            <div
                style="
                    text-align:center;
                    margin-top:18px;
                "
            >

                <a
                    href="../index.html"
                    style="
                        color:#617067;
                        font-size:13px;
                    "
                >
                    ← Back to Home
                </a>

            </div>

        </section>

    </main>


    <!-- Firebase Login -->
    <script type="module">

        import {
            auth
        } from "../js/firebase-config.js";

        import {
            signInWithEmailAndPassword,
            sendPasswordResetEmail,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


        /* =============================================
           ELEMENTS
        ============================================= */

        const loginForm =
            document.getElementById("loginForm");

        const emailInput =
            document.getElementById("email");

        const passwordInput =
            document.getElementById("password");

        const loginButton =
            document.getElementById("loginButton");

        const loginMessage =
            document.getElementById("loginMessage");

        const togglePassword =
            document.getElementById("togglePassword");

        const forgotPassword =
            document.getElementById("forgotPassword");


        /* =============================================
           IF ALREADY LOGGED IN
        ============================================= */

        onAuthStateChanged(
            auth,
            function (user) {

                if (user) {

                    window.location.href =
                        "dashboard.html";

                }

            }
        );


        /* =============================================
           SHOW / HIDE PASSWORD
        ============================================= */

        togglePassword.addEventListener(
            "click",
            function () {

                const hidden =
                    passwordInput.type === "password";

                passwordInput.type =
                    hidden ? "text" : "password";

                togglePassword.textContent =
                    hidden ? "Hide" : "Show";

            }
        );


        /* =============================================
           LOGIN
        ============================================= */

        loginForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();

                hideMessage();


                const email =
                    emailInput.value
                        .trim()
                        .toLowerCase();

                const password =
                    passwordInput.value;


                /* Validation */

                if (!isValidEmail(email)) {

                    showMessage(
                        "Please enter a valid email address.",
                        "error"
                    );

                    return;
                }


                if (!password) {

                    showMessage(
                        "Please enter your password.",
                        "error"
                    );

                    return;
                }


                loginButton.disabled =
                    true;

                loginButton.textContent =
                    "Signing In...";


                try {

                    /* Firebase Authentication */

                    await signInWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );


                    showMessage(
                        "Login successful. Redirecting...",
                        "success"
                    );


                    setTimeout(
                        function () {

                            window.location.href =
                                "dashboard.html";

                        },
                        500
                    );


                } catch (error) {

                    console.error(
                        "Login error:",
                        error
                    );


                    let message =
                        "Unable to sign in. Please try again.";


                    switch (error.code) {

                        case "auth/invalid-credential":

                            message =
                                "Incorrect email or password.";

                            break;


                        case "auth/invalid-email":

                            message =
                                "Please enter a valid email address.";

                            break;


                        case "auth/user-disabled":

                            message =
                                "This account has been disabled.";

                            break;


                        case "auth/too-many-requests":

                            message =
                                "Too many unsuccessful attempts. Please try again later.";

                            break;


                        case "auth/network-request-failed":

                            message =
                                "Network error. Please check your internet connection.";

                            break;


                        default:

                            message =
                                error.message ||
                                message;

                    }


                    showMessage(
                        message,
                        "error"
                    );


                } finally {

                    loginButton.disabled =
                        false;

                    loginButton.textContent =
                        "Sign In";

                }

            }
        );


        /* =============================================
           FORGOT PASSWORD
        ============================================= */

        forgotPassword.addEventListener(
            "click",
            async function (event) {

                event.preventDefault();

                hideMessage();


                const email =
                    emailInput.value
                        .trim()
                        .toLowerCase();


                if (!isValidEmail(email)) {

                    showMessage(
                        "Enter your email address first, then click Forgot Password.",
                        "error"
                    );

                    emailInput.focus();

                    return;
                }


                try {

                    await sendPasswordResetEmail(
                        auth,
                        email
                    );


                    showMessage(
                        "Password reset instructions have been sent to your email.",
                        "success"
                    );


                } catch (error) {

                    console.error(
                        "Password reset error:",
                        error
                    );


                    showMessage(
                        "Unable to send the password reset email. Please check the email address and try again.",
                        "error"
                    );

                }

            }
        );


        /* =============================================
           EMAIL VALIDATION
        ============================================= */

        function isValidEmail(email) {

            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/
                .test(email);

        }


        /* =============================================
           MESSAGE
        ============================================= */

        function showMessage(
            message,
            type
        ) {

            loginMessage.textContent =
                message;

            loginMessage.style.display =
                "block";

            loginMessage.className =
                "alert " +
                (
                    type === "success"
                        ? "alert-success"
                        : "alert-error"
                );

        }


        function hideMessage() {

            loginMessage.style.display =
                "none";

            loginMessage.textContent =
                "";

        }

    </script>

</body>

</html>
